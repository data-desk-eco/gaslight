# Single source of truth for the gaslight shareable-dataset documentation.
#
# scripts/build_dictionary.py reads this file, introspects dist/gaslight.duckdb
# for the actual columns/types/row-counts, and generates:
#   - docs/data-dictionary/README.md       (index + overview)
#   - docs/data-dictionary/<table>.md       (one per table)
#   - dist/gaslight.duckdb  _dictionary, _sources  (in-DB metadata tables)
#
# Edit the prose here; never hand-edit the generated markdown. If a column
# exists in the DB but is missing below (or vice-versa), the build warns.

dataset:
  title: Permian Basin Flaring Dataset
  subtitle: Satellite-observed flaring, state permits, production, and methane plumes
  intro: |
    This is the data behind *gaslight*, an analysis of natural-gas flaring in
    the Permian Basin of West Texas. It links four independent kinds of evidence
    about where and how much gas is being burned or vented:

    1. **What satellites see** — VIIRS Nightfire infrared flare detections and
       Sentinel-2 shortwave-infrared detections.
    2. **What operators are permitted to do** — Texas Railroad Commission (RRC)
       Statewide Rule 32 flaring/venting exception permits.
    3. **What operators report** — RRC monthly lease-level gas disposition
       (how much gas was flared/vented) and production volumes, plus the wells,
       operators, and gas gatherers/purchasers tied to each lease.
    4. **What methane sensors detect** — Carbon Mapper and UNEP IMEO plume
       observations.

    The dataset is a single DuckDB database, `gaslight.duckdb`. Every table is a
    plain, documented table — open it with the free DuckDB binary (or read the
    tables straight into pandas/R/QGIS) and start querying.
  key_caveat: |
    **Reported vs. observed flaring — read this first.** The flaring *volumes*
    in this dataset (`monthly_flaring`, and the `flared_mcf` / `flaring_intensity_pct`
    columns derived from them) are **self-reported by operators to the RRC**.
    The satellite layers (`vnf_sites`, `vnf_detections`, `s2_detections`)
    are **independent observations** of combustion from space. These two do not
    always agree — a flare can burn brightly on satellite imagery in a month an
    operator reports little or no flaring. That gap is the central finding of the
    reporting this dataset supports; treat the two families of evidence as
    *separate*, not interchangeable.
  scope: |
    **Geography.** Everything is clipped to the Permian Basin bounding box:
    latitude 30.0–33.5°N, longitude -104.5 to -100.0°W. Above 32°N, points must
    sit east of -103.064°W (the Texas–New Mexico border) so the dataset is
    Texas-only. The one exception is `operators`, an RRC-wide name lookup with no
    geography.

    **Time.** Time-series tables (`vnf_detections`, `monthly_flaring`) and the
    rollups derived from them cover **2021-01-01 onward**, matching the satellite
    analysis window. Longer RRC history exists upstream and the window is a single
    pipeline setting that can be widened on request.
  method_notes: |
    - **375 m spatial matching.** Flares are linked to wells/permits using a fixed
      375 m radius — the half-width of a VIIRS M-band pixel (750 m). A ±0.0034°
      lat/lon bounding box is the cheap pre-filter.
    - **No imputation.** Missing values stay missing. Nothing is modelled, filled,
      or guessed; if a permit has no effective date or a lease has no production in
      a month, the cell is null/absent.
    - **Coordinates** are decimal degrees, WGS84. There is no geometry/WKB column —
      use `latitude`/`longitude` directly.
    - **Lease numbers** are zero-padded to 6 digits everywhere, so `lease_district`
      + `lease_number` joins cleanly across tables.
  how_to_use: |
    Install DuckDB (a single dependency-free binary, <https://duckdb.org/docs/installation>)
    and open the file:

    ```sh
    duckdb gaslight.duckdb
    ```

    ```sql
    -- list tables
    SHOW TABLES;
    -- in-database column dictionary
    SELECT * FROM _dictionary WHERE table_name = 'wells_tx';
    -- the brightest flare sites by total radiant heat
    SELECT flare_id, lat, lon, detection_days, total_rh_mw
    FROM vnf_sites ORDER BY total_rh_mw DESC LIMIT 20;
    ```

    Prefer another tool? Every table also reads directly into pandas
    (`duckdb.sql("SELECT * FROM vnf_sites").df()`), R, or QGIS (via the
    latitude/longitude columns).

# Upstream sources. `id` is referenced by each table's `source:` list.
sources:
  - id: eog_vnf
    name: VIIRS Nightfire (VNF)
    provider: Earth Observation Group, Payne Institute, Colorado School of Mines
    url: https://eogdata.mines.edu/products/vnf/
    license: Free for use with attribution to the Earth Observation Group.
    retrieval: Per-site nightly profiles fetched via scripts/fetch_vnf.py.
  - id: s2
    name: Sentinel-2 SWIR flare detection
    provider: Copernicus / ESA imagery, detected by the permian-flaring project
    url: https://dataspace.copernicus.eu/
    license: Copernicus Sentinel data, free and open. Detections are derived products.
    retrieval: |
      Detected from Sentinel-2 L2A B11/B12 bands and ranked by the sibling
      permian-flaring project; gaslight fetches the top-scoring catalogue via
      `make s2` (a one-row-per-site export with per-date observations).
  - id: rrc_swr32
    name: RRC Statewide Rule 32 flaring/venting permits
    provider: Texas Railroad Commission
    url: https://www.rrc.texas.gov/
    license: Texas public records.
    retrieval: Scraped from the RRC SWR 32 web database (scripts/scrape_permits.py, scrape_permit_details.py).
  - id: rrc_mft
    name: RRC well, operator, and P-4 gatherer records
    provider: Texas Railroad Commission (Mainframe File Transfer, EBCDIC)
    url: https://www.rrc.texas.gov/resource-center/research/data-sets-available-for-download/
    license: Texas public records.
    retrieval: Downloaded and parsed from RRC EBCDIC files (scripts/download_rrc.py, parse_rrc.py).
  - id: rrc_pdq
    name: RRC Production Data Query (PDQ)
    provider: Texas Railroad Commission
    url: https://www.rrc.texas.gov/resource-center/research/online-research-queries/
    license: Texas public records.
    retrieval: Monthly lease disposition + production from the PDQ DSV export.
  - id: rrc_r3
    name: RRC R-3 gas processing facilities
    provider: Texas Railroad Commission
    url: https://www.rrc.texas.gov/
    license: Texas public records.
    retrieval: scripts/fetch_r3.py.
  - id: carbon_mapper
    name: Carbon Mapper methane plumes
    provider: Carbon Mapper
    url: https://carbonmapper.org/
    license: CC BY 4.0 (verify current terms before redistribution).
    retrieval: scripts/fetch_plumes.py.
  - id: imeo
    name: UNEP IMEO methane plumes
    provider: UN Environment Programme — International Methane Emissions Observatory
    url: https://methanedata.unep.org/
    license: Public; attribute UNEP IMEO.
    retrieval: Manual GeoJSON download from methanedata.unep.org.
  - id: nmocd
    name: New Mexico OCD spill/release incidents
    provider: New Mexico Energy, Minerals and Natural Resources Dept. — Oil Conservation Division
    url: https://wwwapps.emnrd.nm.gov/OCD/OCDPermitting/Data/Spills/SpillSearchResults.aspx
    license: Public record.
    retrieval: scripts/fetch_nmocd.py.

tables:
  vnf_sites:
    purpose: |
      One row per VIIRS Nightfire flare site detected in the Permian during the
      analysis window — the satellite-observed flare locations and how active
      each has been. The primary "where are the flares" layer.
    summary: Satellite-observed flare locations and how active each has been.
    grain: one row per VNF flare site (`flare_id`)
    source: [eog_vnf]
    scope: Detected nights only, 2021-01-01 onward, Permian (Texas) bbox.
    caveats: |
      `total_rh_mw` and `avg_rh_mw` are radiant heat in **megawatts** — a measure
      of fire intensity, *not* a gas volume. Position is the mean of all detected
      passes. Presence here means a flare was *seen burning*; it is independent of
      whether the operator reported flaring (see `monthly_flaring`).
    example: |
      -- most persistently-burning sites
      SELECT flare_id, lat, lon, detection_days, total_rh_mw
      FROM vnf_sites
      ORDER BY detection_days DESC
      LIMIT 25;
    columns:
      flare_id: VIIRS Nightfire site identifier (assigned by the Earth Observation Group).
      lat: Site latitude, decimal degrees WGS84 (mean of detected passes).
      lon: Site longitude, decimal degrees WGS84 (mean of detected passes).
      detection_days: Number of distinct nights the site was detected burning (2021+).
      first_detected: First detected night in the window.
      last_detected: Most recent detected night.
      total_rh_mw: Sum of per-night radiant heat across all detected nights, megawatts.
      avg_rh_mw: Mean radiant heat over nights with a positive reading, megawatts.
      avg_flow_rate: Mean EOG-estimated flaring flow rate (VNF `Flow_Rate` field, as published) over nights with a fitted reading. Null where no night had a converged Nightfire fit.
  vnf_detections:
    purpose: |
      The per-night detection time series behind `vnf_sites` — one row for every
      night a given flare was observed burning. Powers timelines and lets you see
      when a flare started, stopped, or intensified.
    summary: Per-night detection time series behind each flare site.
    grain: one row per flare site × detected night
    source: [eog_vnf]
    scope: Detected nights only, 2021-01-01 onward.
    caveats: |
      Only nights with a detection are present (no zero rows for quiet nights, and
      cloudy nights may simply be missing). `rh_mw` is radiant heat in megawatts;
      `flow_rate` is the EOG-estimated flaring flow rate (VNF `Flow_Rate` field,
      as published), present only on the ~63% of detections with a converged
      Nightfire fit.
    example: |
      SELECT date, rh_mw
      FROM vnf_detections
      WHERE flare_id = (SELECT flare_id FROM vnf_sites ORDER BY total_rh_mw DESC LIMIT 1)
      ORDER BY date;
    columns:
      flare_id: VIIRS Nightfire site identifier; joins to vnf_sites.
      date: Detection date (night of the satellite pass).
      rh_mw: Radiant heat for that night, megawatts.
      flow_rate: EOG-estimated flaring flow rate for that night (VNF `Flow_Rate` field, as published). Null when the Nightfire fit did not converge.
  permits:
    purpose: |
      Texas RRC Statewide Rule 32 flaring/venting exception permits, one row per
      filing, geolocated to the permitted flare. What operators have asked the
      state for permission to flare or vent.
    summary: RRC SWR 32 flaring/venting exception permits, geolocated.
    grain: one row per SWR 32 permit filing (`filing_no`)
    source: [rrc_swr32]
    scope: Permitted flare locations inside the Permian (Texas) bbox.
    caveats: |
      Gas-plant filings are **kept** and flagged with `is_gas_plant` (the web map
      hides them, but they are leads worth seeing). Dates are the requested
      effective/expiration dates parsed from the detail pages; some are null when
      the filing did not state them (no imputation).
    example: |
      -- approved active permits by operator
      SELECT operator_name, count(*) AS filings
      FROM permits
      WHERE status = 'Approved' AND NOT is_gas_plant
      GROUP BY 1 ORDER BY filings DESC LIMIT 20;
    columns:
      filing_no: RRC filing number (unique permit id).
      latitude: Permitted flare latitude, decimal degrees WGS84.
      longitude: Permitted flare longitude, decimal degrees WGS84.
      name: Site/facility name on the filing.
      county: Texas county.
      district: RRC district of the flare location.
      release_type: Type of release permitted (e.g. flaring, venting).
      operator_no: RRC operator number of the filer.
      operator_name: Operator (company) that filed the permit.
      property_type: Property classification (Oil Lease, Gas Lease, Gas Plant, Drilling Permit, …).
      status: Filing status (Approved, Denied, Returned, Hearing Pending, Cancelled).
      effective_dt: Requested effective date of the exception (nullable).
      expiration_dt: Requested expiration date of the exception (nullable).
      release_rate_mcf_day: Requested release rate summed across the filing's leases, MCF/day.
      exception_reasons: Free-text reason(s) the operator gave for the exception.
      is_gas_plant: True if the filing is a gas-plant property (excluded from the web map layer).
  permit_leases:
    purpose: |
      The leases underlying each SWR 32 filing. Commingle permits cover multiple
      leases; this flattens a filing to its constituent leases so permits can be
      joined to production, wells, and gatherers.
    summary: The leases underlying each SWR 32 permit filing.
    grain: one row per filing × underlying lease
    source: [rrc_swr32]
    scope: Leases of permits present in `permits`.
    caveats: |
      `requested_release_rate_mcf_day` is per-lease as stated on the filing and may
      be null. Join to leases on (`lease_district`, `lease_number`).
    example: |
      SELECT pl.filing_no, pl.lease_name, pl.requested_release_rate_mcf_day
      FROM permit_leases pl
      WHERE pl.lease_district = '08'
      ORDER BY pl.requested_release_rate_mcf_day DESC NULLS LAST
      LIMIT 20;
    columns:
      filing_no: RRC filing number; joins to permits.
      property_type: Lease type (Oil Lease, Gas Lease, Drilling Permit).
      lease_district: RRC district of the lease (alphanumeric, e.g. 7C, 08, 8A).
      lease_number: RRC lease number, zero-padded to 6 digits.
      lease_name: Lease name on the filing.
      requested_release_rate_mcf_day: Requested release rate for this lease, MCF/day (nullable).
  wells_tx:
    purpose: |
      Every oil/gas well in the Permian (Texas), with location, operator, and the
      flaring metrics of the lease it belongs to. The most useful table for
      lead-hunting: filter by operator, intensity, or area. (New Mexico wells live
      in the sibling `wells_nm` table.)
    summary: Every Permian (Texas) well, with operator and its lease's flaring metrics.
    grain: one row per well (API)
    source: [rrc_mft, rrc_pdq]
    scope: Wells with valid coordinates inside the Permian (Texas) bbox.
    caveats: |
      `flared_mcf`, `produced_mcf`, and `flaring_intensity_pct` are **lease-level**
      totals (2021+), repeated on every well of the lease — they are not per-well.
      Wells whose lease reported no flaring show 0 / null. Flaring figures are
      operator-reported (see the dataset caveat). `operator_name` is the well's
      current RRC operator; "Unknown" where unmatched.
    example: |
      -- highest-intensity leases, via their wells
      SELECT DISTINCT lease_district, lease_number, lease_name, operator_name,
             flared_mcf, flaring_intensity_pct
      FROM wells_tx
      WHERE flaring_intensity_pct IS NOT NULL
      ORDER BY flaring_intensity_pct DESC
      LIMIT 25;
    columns:
      api: Well API number (RRC unique well identifier).
      oil_gas_code: Whether the well is on an Oil (O) or Gas (G) lease.
      lease_district: RRC district of the lease (alphanumeric).
      lease_number: RRC lease number, zero-padded to 6 digits.
      well_number: Well number within the lease.
      operator_no: RRC operator number.
      operator_name: Current operator (company); "Unknown" if unmatched.
      latitude: Well latitude, decimal degrees WGS84.
      longitude: Well longitude, decimal degrees WGS84.
      flared_mcf: Lease total reported gas flared/vented, MCF, 2021+ (repeated per well).
      produced_mcf: Lease total gas produced, MCF, 2021+ (denominator for intensity).
      flaring_intensity_pct: Lease flared ÷ produced, percent (null when no production).
      lease_name: Lease name.
  wells_nm:
    purpose: |
      Every active, un-plugged oil/gas well on the New Mexico side of the Permian,
      from the NM OCD well search. The counterpart to `wells_tx`; header
      attributes only (no PDQ lease/flaring metrics exist for New Mexico).
    summary: Active New Mexico (OCD) Permian wells — header attributes only.
    grain: one row per well (API)
    source: [nmocd]
    scope: NM OCD wells (surface location, cancelled APDs and plugged wells excluded) inside the Permian bbox.
    caveats: |
      No flaring/production figures — New Mexico has no equivalent of the RRC PDQ
      disposition feed, so unlike `wells_tx` these rows carry location and status
      only. `operator` is the current OCD operator-of-record. Coordinates are
      NAD83 as published by the OCD.
    example: |
      -- active NM Permian wells by operator
      SELECT operator, count(*) AS n
      FROM wells_nm WHERE status = 'Active'
      GROUP BY operator ORDER BY n DESC LIMIT 25;
    columns:
      api: Well API number (NM OCD, 30-###-##### format).
      well_name: Well name.
      well_number: Well number within the lease/unit.
      well_type: Well type (Oil, Gas, Injection, etc.).
      status: OCD well status (Active, New, etc.).
      operator: Current OCD operator-of-record (company name).
      ogrid: NM operator (OGRID) number.
      district: OCD district office (Hobbs, Artesia, etc.).
      section: Public-land-survey section.
      township: Public-land-survey township.
      range: Public-land-survey range.
      footages: Footage call from the section lines (e.g. "935 FSL, 1443 FWL").
      apd_date: Initial APD approval date.
      spud_date: Spud date, where recorded.
      last_production: Most recent month with reported production (first of month).
      measured_depth: Measured depth, feet.
      true_vertical_depth: True vertical depth, feet.
      latitude: Well latitude, decimal degrees (NAD83).
      longitude: Well longitude, decimal degrees (NAD83).
  leases:
    purpose: |
      Lease-level rollup of reported flaring for every Permian lease that reported
      any flaring in the window — totals, intensity, and well count. The quickest
      way to rank leases by reported flaring.
    summary: Lease-level rollup of reported flaring, intensity, and well count.
    grain: one row per lease (`lease_district` + `lease_number`)
    source: [rrc_pdq, rrc_mft]
    scope: Permian (Texas) leases with reported flaring, 2021+.
    caveats: |
      Only leases with reported flaring appear (a lease absent here reported none).
      Volumes are operator-reported. `flaring_intensity_pct` is null when the lease
      has flaring but no recorded production denominator.

      `operator_name`/`operator_no` are the **current** operator-of-record (latest
      reported month) — a lease-level label, not an attribution of the whole
      total. Do **not** rank operators by summing `total_flared_mcf` here: it
      credits acquirers with a predecessor's pre-deal flaring. For per-operator
      totals use `monthly_flaring` (operator-attributed per month). `operator_no`
      is the RRC legal-entity id and does not fold subsidiaries/acquisitions into
      a parent — company rollups still need a separate crosswalk.
    example: |
      SELECT lease_district, lease_number, lease_name, operator_name,
             total_flared_mcf, flaring_intensity_pct, well_count
      FROM leases
      ORDER BY total_flared_mcf DESC
      LIMIT 25;
    columns:
      lease_district: RRC district (alphanumeric).
      lease_number: RRC lease number, zero-padded to 6 digits.
      lease_name: Lease name (most common spelling across months).
      operator_no: RRC operator number of the current operator-of-record.
      operator_name: Current operator-of-record (latest reported month).
      total_flared_mcf: Total gas flared/vented over the window, MCF (reported).
      total_gas_prod_mcf: Total gas produced over the window, MCF.
      flaring_intensity_pct: total_flared ÷ total_produced, percent (nullable).
      well_count: Number of wells on the lease (within the Permian bbox).
  monthly_flaring:
    purpose: |
      Monthly lease-level gas disposition — how much gas each lease reported
      flaring/venting (RRC disposition code 04) each month, alongside total
      disposed and produced volumes. The reported-flaring time series.
    summary: Monthly lease-level reported gas flared/vented and produced.
    grain: one row per lease × month with reported flaring
    source: [rrc_pdq]
    scope: Permian (Texas) districts, months with flaring, 2021+.
    caveats: |
      **Flaring months only.** A row exists only for lease-months that reported
      flaring/venting; this is not a complete production table. All volumes are
      operator-reported. `total_flared_mcf` = `gas_flared_mcf` + `csgd_flared_mcf`.
    example: |
      -- monthly reported flaring trend, basin-wide
      SELECT date, round(sum(total_flared_mcf)) AS flared_mcf
      FROM monthly_flaring
      GROUP BY date ORDER BY date;
    columns:
      oil_gas_code: Oil (O) or Gas (G) lease.
      lease_district: RRC district (alphanumeric).
      lease_number: RRC lease number, zero-padded to 6 digits.
      lease_name: Lease name.
      operator_no: RRC operator number.
      operator_name: Reporting operator.
      field_name: RRC field name.
      year: Production cycle year.
      month: Production cycle month (1–12).
      date: First day of the cycle month (convenience date).
      gas_flared_mcf: Gas-well gas flared/vented this month, MCF (disposition code 04).
      csgd_flared_mcf: Casinghead (oil-well) gas flared/vented this month, MCF.
      total_flared_mcf: gas_flared_mcf + csgd_flared_mcf, MCF.
      total_disposed_mcf: Total gas disposed of this month across all disposition codes, MCF.
      total_gas_prod_mcf: Total gas produced this month, MCF.
  gatherers:
    purpose: |
      Who moves and buys each lease's gas — the gatherers, purchasers, and
      nominators reported on RRC P-4 forms. Connects a flaring lease to the
      midstream companies handling its gas.
    summary: Gatherers, purchasers, and nominators handling each lease's gas.
    grain: one row per lease × role × entity (current/historical)
    source: [rrc_mft]
    scope: Permian (Texas) district leases.
    caveats: |
      Roles: Gatherer, Purchaser, Nominator. `is_current` distinguishes the active
      arrangement from historical ones. `gpn_name` falls back to "Unknown (number)"
      when the org number does not resolve to a known operator.
    example: |
      SELECT type, gpn_name, percentage, is_current, first_date, last_date
      FROM gatherers
      WHERE district = '08' AND lease_number = '000001'
      ORDER BY is_current DESC, last_date DESC NULLS LAST;
    columns:
      oil_gas_code: Oil (O) or Gas (G) lease.
      district: RRC district (alphanumeric).
      lease_number: RRC lease number, zero-padded to 6 digits.
      type: Role of the entity — Gatherer, Purchaser, or Nominator.
      percentage: Share attributed to this entity, percent.
      gpn_number: Gatherer/Purchaser/Nominator P-5 organisation number.
      gpn_name: Entity name (resolved from the org number; fallback "Unknown (number)").
      is_current: String 'true'/'false' — whether this is the current arrangement.
      first_date: Earliest effective date seen for this entity on the lease (nullable).
      last_date: Latest effective date seen (nullable).
  plumes:
    purpose: |
      Methane plume observations from Carbon Mapper and UNEP IMEO — point
      detections of methane emissions with estimated rates. An independent
      emissions signal to cross-reference against flares and leases.
    summary: Methane plume detections (Carbon Mapper + UNEP IMEO).
    grain: one row per plume observation (`plume_id`)
    source: [carbon_mapper, imeo]
    scope: Permian bbox.
    caveats: |
      Two providers are merged via `source` ('cm' = Carbon Mapper, 'imeo' = UNEP
      IMEO); their methodologies and detection limits differ. `emission_rate` is an
      instantaneous estimate (kg/hr), not a monthly total, with `emission_uncertainty`.
    example: |
      SELECT source, count(*) AS plumes, round(avg(emission_rate)) AS avg_kg_hr
      FROM plumes WHERE sector = 'og' GROUP BY source;
    columns:
      plume_id: Provider plume identifier.
      source: Data provider — 'cm' (Carbon Mapper) or 'imeo' (UNEP IMEO).
      satellite: Observing platform/instrument.
      date: Observation date.
      latitude: Plume latitude, decimal degrees WGS84.
      longitude: Plume longitude, decimal degrees WGS84.
      emission_rate: Estimated methane emission rate, kg/hr.
      emission_uncertainty: Uncertainty on the emission rate, kg/hr.
      sector: Attributed sector — 'og' (oil & gas), 'coal', 'waste', or 'other'.
  nm_notifications:
    purpose: |
      New Mexico OCD spill/release incident notifications — the New Mexico
      counterpart to the Texas SWR-32 permit and plume layers. Includes routine
      flaring and venting notices as well as spills, so the NM Delaware side of
      the Permian is covered alongside Texas.
    summary: New Mexico OCD spill/flare/vent incident notifications (Permian, 2021+).
    grain: one row per reported incident (`incident_number` may repeat across materials)
    source: [nmocd]
    scope: Permian bbox, 2021+.
    caveats: |
      Self-reported by operators to the NM OCD, like the RRC disposition volumes
      on the Texas side — not an independent observation. `incident_type` is
      dominated by routine `Flare` notices; `Vent` / `Vent with Flaring` carry the
      vented-gas volume in `volume_released` (`volume_unit` usually 'Mcf'). Many
      spill rows carry no volume. Coordinates are operator-supplied.
    example: |
      SELECT incident_type, count(*) AS n,
        round(sum(volume_released) FILTER (volume_unit ILIKE 'mcf')) AS mcf
      FROM nm_notifications GROUP BY incident_type ORDER BY n DESC;
    columns:
      incident_number: OCD incident identifier.
      incident_date: Date the incident occurred.
      notification_date: Date the operator notified the OCD.
      incident_type: Incident category — 'Flare', 'Vent', 'Vent with Flaring', 'Oil Release', etc.
      severity: OCD severity classification (Minor / Major).
      operator: Reporting operator name.
      ogrid: NM operator (OGRID) number.
      facility_name: Facility name, where given.
      well_name: Associated well name, where given.
      api: Well API number, where given.
      material: Material released (e.g. 'Natural Gas Vented', 'Crude Oil').
      volume_released: Volume released, in `volume_unit`.
      volume_unit: Unit for the volumes (usually 'Mcf' for gas, 'BBL' for liquids).
      cause: Reported cause (e.g. 'Equipment Failure', 'Liquids Unloading').
      spill_source: Reported source (e.g. 'Well', 'Flow Line - Production').
      lease_type: Land/lease type — 'Federal', 'State', 'Private'.
      county: New Mexico county (name + FIPS).
      district: OCD district office (Hobbs, Artesia, …).
      ulstr: Unit-letter / section / township / range legal location.
      latitude: Incident latitude, decimal degrees WGS84.
      longitude: Incident longitude, decimal degrees WGS84.
  facilities:
    purpose: |
      RRC R-3 gas processing facilities (gas plants). Used to distinguish
      plant-related flares from wellsite flaring, and useful context for where
      gathered gas is processed.
    summary: RRC R-3 gas processing facilities (gas plants).
    grain: one row per gas processing facility (`serial_number`)
    source: [rrc_r3]
    scope: Permian bbox.
    caveats: |
      Coordinates are facility points. A flare within ~5 km of a plant is more
      likely plant-related than wellsite flaring.
    example: |
      SELECT facility_name, plant_type, latitude, longitude FROM facilities;
    columns:
      serial_number: RRC facility serial number.
      facility_name: Facility (plant) name.
      plant_type: Type of processing plant.
      latitude: Facility latitude, decimal degrees WGS84.
      longitude: Facility longitude, decimal degrees WGS84.
  operators:
    purpose: |
      RRC operator-number → name lookup. Reference table for resolving operator
      numbers found elsewhere (wells, permits, gatherers).
    summary: RRC operator-number → name reference lookup.
    grain: one row per RRC operator number
    source: [rrc_mft]
    scope: RRC-wide (statewide) — the one table not geographically clipped.
    caveats: |
      Statewide, not Permian-only — it is a name lookup. `status` reflects the
      operator's RRC standing.
    example: |
      SELECT * FROM operators WHERE operator_name ILIKE '%diamondback%';
    columns:
      operator_no: RRC operator number.
      operator_name: Operator (company) name.
      status: RRC operator status.
  s2_detections:
    purpose: |
      Sentinel-2 shortwave-infrared (SWIR) flare sites — a higher-spatial-
      resolution complement to VIIRS Nightfire, better at separating nearby
      flares. One row per detected site (clustered to an H3 cell), with the
      site's per-date observations carried in the `detections` array.
    summary: Sentinel-2 SWIR flare sites (top-scoring, from permian-flaring).
    grain: one row per H3 flare site
    source: [s2]
    scope: |
      The Texas clip of permian-flaring's published catalogue (its top 3,000
      sites by detection score, basin-wide; gaslight keeps only the Texas ones).
      2025-01-01 to 2026-05-31 window (the Sentinel-2 archive used by
      permian-flaring), unlike the other satellite layers which are 2021+.
    caveats: |
      Detected and scored by the sibling **permian-flaring** project (the S2
      detection engine), not by gaslight; gaslight consumes the ranked catalogue
      as a display layer. `corroborated` means a site sits near independent
      evidence (VIIRS, RRC permits/wells, a Carbon Mapper plume, or OSM flare
      infrastructure) — see `nearest_source`. `b12`/`b11` are SWIR reflectances;
      a real flare's peak B12/B11 ratio exceeds ~1.15 (lower can be sun glint).
      `detections` is a JSON array of `{date, max_b12, pixels}` objects, one per
      acquisition the site was seen on.
    example: |
      -- brightest, most-detected S2 flare sites
      SELECT h3, lat, lon, n_dates, n_detections, max_b12, corroborated, nearest_source
      FROM s2_detections
      ORDER BY total_score DESC
      LIMIT 25;
    columns:
      h3: H3 cell id (resolution 11) identifying the flare site; stable across rebuilds.
      lat: Site latitude, decimal degrees WGS84 (detection centroid).
      lon: Site longitude, decimal degrees WGS84 (detection centroid).
      n_detections: Number of Sentinel-2 acquisitions the site was detected on.
      n_dates: Number of distinct dates detected (<= n_detections).
      n_clear_obs: Number of distinct dates Sentinel-2 got a cloud-free look at the site (the persistence denominator, from the SCL coverage pass).
      persistence: Fraction of clear-sky looks the site was flaring (n_dates / n_clear_obs, 0-1); high = a steady flare, low = sporadic.
      first_date: First detection date.
      last_date: Most recent detection date.
      max_b12: Peak B12 (SWIR-2) reflectance across all detections.
      mean_max_b12: Mean of the per-detection peak B12 reflectance.
      b12_b11_ratio: Peak B12/B11 reflectance ratio (a temperature proxy; >~1.15 indicates true combustion).
      min_glint_score: Lowest sun-glint score across detections (low = unlikely glint).
      total_score: Composite detection-quality score used to rank the catalogue.
      corroborated: Whether the site is corroborated by independent evidence (see nearest_source).
      nearest_source: Nearest corroborating source (e.g. VNF, RRC, Carbon Mapper, OSM), or 'uncorroborated'.
      detections: JSON array of per-date observations -- '{date, max_b12, pixels}' objects.
